# Deney 1 - TEMEL (baseline) PPO
# Çalıştır:  mlagents-learn config/maze_ppo.yaml --run-id=Maze_01_Baseline
behaviors:
  MazeAgent:                 # Behavior Parameters > Behavior Name ile AYNI olmalı
    trainer_type: ppo
    hyperparameters:
      batch_size: 256        # her gradyan adımındaki örnek sayısı
      buffer_size: 4096      # politika güncellemesinden önce toplanan deneyim
      learning_rate: 3.0e-4
      beta: 5.0e-3           # entropi katsayısı (keşif)
      epsilon: 0.2           # PPO clip aralığı
      lambd: 0.95            # GAE lambda
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000      # TensorBoard'a yazma sıklığı
